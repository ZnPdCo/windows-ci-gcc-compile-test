name: g++ Benchmark
on: push
jobs:
  benchmark:
    runs-on: windows-2025-vs2026
    steps:
      - name: Benchmark
        shell: pwsh
        run: |
          $src = @'
          #include <cstring>
          #include <iostream>
          #include <vector>

          using namespace std;

          int f(int n) {
          	vector<int> a(1);
          	for (int i = 0; i < n; i++) {
          		a[i] = 100;
          	}
          }
          int *p;
          int main() {
          	int s;
          	cin >> s;
          	switch (s) {
          		case 1:
          			cout << "AC" << endl;
          			break;
          		case 2:
          			cout << "WA" << endl;
          			break;
          		case 3:
          			for (int i = 0; i < 200; i++)
          				p = new int[1 << 24], memset(p, 0x3f, sizeof(int) * (1 << 24));
          			break;
          		case 4:
          			while (1)
          				;
          			break;
          		case 5:
          			f(100);
          			break;
          		default:
          			break;
          	}
          }
          '@
          $srcFile = "$env:TEMP\helloworld.cpp"
          $exeFile = "$env:TEMP\helloworld.exe"
          Set-Content -Path $srcFile -Value $src

          $t1 = Measure-Command { & g++ -O2 -o $exeFile $srcFile 2>&1 | Out-Null }
          Write-Output "1st: $($t1.TotalMilliseconds) ms"
          Remove-Item $exeFile -Force -ErrorAction SilentlyContinue

          Write-Output ""
          $t2 = Measure-Command { & g++ -O2 -o $exeFile $srcFile 2>&1 | Out-Null }
          Write-Output "2st: $($t2.TotalMilliseconds) ms"
          Remove-Item $exeFile -Force -ErrorAction SilentlyContinue

          Write-Output ""
          $t3 = Measure-Command { & g++ -O2 -o $exeFile $srcFile 2>&1 | Out-Null }
          Write-Output "3st: $($t3.TotalMilliseconds) ms"
          Remove-Item $exeFile -Force -ErrorAction SilentlyContinue

          $ratio = [math]::Round($t1.TotalMilliseconds / $t2.TotalMilliseconds, 1)
          Write-Output ""
          Write-Output "1st: $($t1.TotalMilliseconds) ms"
          Write-Output "2st: $($t2.TotalMilliseconds) ms"
          Write-Output "3st: $($t3.TotalMilliseconds) ms"
          Write-Output "Ratio: ${ratio}x slower"
